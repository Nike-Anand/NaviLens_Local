name: navilens_local
description: Offline-first multimodal accessibility assistant
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # Camera and AI capabilities
  camera: ^0.10.5
  google_mlkit_text_recognition: ^0.11.0
  google_mlkit_pose_detection: ^0.10.0
  google_mlkit_object_detection: ^0.11.0
  
  # Voice and Haptics
  flutter_tts: ^3.8.3
  vibration: ^1.8.3

  # Local Storage
  sqflite: ^2.3.0
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
